name: Prepare KDE Connect upstream release

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: kde-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      already_included: ${{ steps.merge.outputs.already_included }}
      base: ${{ steps.merge.outputs.base }}
      upstream: ${{ steps.merge.outputs.upstream }}
      upstream_tag: ${{ steps.merge.outputs.upstream_tag }}
      upstream_tag_object: ${{ steps.merge.outputs.upstream_tag_object }}
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: merge
        name: Check upstream and prepare merge
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/KDE/kdeconnect-android.git '+refs/tags/*:refs/kde-tags/*'
          git for-each-ref --format='%(refname:strip=2)' refs/kde-tags > "$RUNNER_TEMP/kde-tags"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/fork-releases.json"
          upstream_tag=$(python3 .github/scripts/select-upstream-tag.py "$RUNNER_TEMP/kde-tags" "$RUNNER_TEMP/fork-releases.json")
          if [ -z "$upstream_tag" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No newer stable KDE tag than the published fork release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(git rev-parse HEAD)
          tag_object=$(git rev-parse "refs/kde-tags/$upstream_tag")
          upstream=$(git rev-parse "refs/kde-tags/$upstream_tag^{commit}")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'already_included=true' >> "$GITHUB_OUTPUT"
            echo 'The upstream release is already included in main; checking publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git -c merge.renormalize=false merge --no-commit --no-ff "$upstream"; then
            {
              echo '## Upstream merge conflict'
              echo 'The merge was stopped without pushing changes. Resolve the following files manually:'
              echo '```'
              git diff --name-only --diff-filter=U
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo '::error::Upstream merge has conflicts; see the workflow summary. No changes were pushed.'
            exit 1
          fi
          tree=$(git write-tree)
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct tested merge
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          UPSTREAM_TAG_OBJECT: ${{ needs.prepare.outputs.upstream_tag_object }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/KDE/kdeconnect-android.git "refs/tags/$UPSTREAM_TAG:refs/kde-tags/$UPSTREAM_TAG"
          test "$(git rev-parse "refs/kde-tags/$UPSTREAM_TAG")" = "$UPSTREAM_TAG_OBJECT" && test "$(git rev-parse "refs/kde-tags/$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA" || { echo '::error::Upstream tag changed during the run.'; exit 1; }
          git -c merge.renormalize=false merge --no-commit --no-ff "$UPSTREAM_SHA"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          (yes || true) | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0' 'platform-tools'
          find "$sdk_root/platforms" -name android.jar -print -quit | grep -q .
          test -x "$sdk_root/build-tools/37.0.0/apksigner"
      - name: Test tag selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test and build APKs
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug assembleRelease
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kdeconnect-debug-${{ needs.prepare.outputs.upstream }}
          path: build/outputs/apk/debug/*-debug.apk
          if-no-files-found: error
          retention-days: 14

  pull-request:
    needs: [prepare, test]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' && needs.test.result != 'cancelled' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged_commit: ${{ steps.publish.outputs.merged_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - id: publish
        name: Publish or update synchronization PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          UPSTREAM_TAG_OBJECT: ${{ needs.prepare.outputs.upstream_tag_object }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch='automation/kde-upstream-sync'
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA" || { echo '::error::main changed during the run; retry the synchronization.'; exit 1; }
          git fetch --no-tags https://github.com/KDE/kdeconnect-android.git "refs/tags/$UPSTREAM_TAG:refs/kde-tags/$UPSTREAM_TAG"
          test "$(git rev-parse "refs/kde-tags/$UPSTREAM_TAG")" = "$UPSTREAM_TAG_OBJECT" && test "$(git rev-parse "refs/kde-tags/$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA" || { echo '::error::Upstream tag changed during the run.'; exit 1; }
          pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')
          old=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [ -n "$old" ]; then
            test -n "$pr" || { echo '::error::Managed branch exists without an open PR; refusing to overwrite it.'; exit 1; }
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            test "$(git rev-parse "refs/remotes/origin/$branch")" = "$old"
            read -r commit parent1 parent2 extra < <(git rev-list --parents -n 1 "$old")
            test "$commit" = "$old"
            test -n "${parent2:-}" && test -z "${extra:-}" || { echo '::error::Managed branch has unexpected commits; refusing to overwrite it.'; exit 1; }
            git merge-base --is-ancestor "$parent1" "$BASE_SHA"
            git merge-base --is-ancestor "$parent2" "$UPSTREAM_SHA"
            old_tree=$(git merge-tree --write-tree "$parent1" "$parent2")
            test "$(git rev-parse "$old^{tree}")" = "$old_tree" || { echo '::error::Managed branch contains manual changes; refusing to overwrite it.'; exit 1; }
          elif [ -n "$pr" ]; then
            echo '::error::An open synchronization PR has no branch; refusing to recreate it.'
            exit 1
          fi
          if [ -z "$old" ] || [ "${parent1:-}" != "$BASE_SHA" ] || [ "${parent2:-}" != "$UPSTREAM_SHA" ] || [ "$(git rev-parse "$old^{tree}")" != "$EXPECTED_TREE" ]; then
            git -c merge.renormalize=false merge --no-commit --no-ff "$UPSTREAM_SHA"
            test "$(git write-tree)" = "$EXPECTED_TREE"
            git commit -m "Merge KDE Connect upstream $UPSTREAM_SHA"
            gh auth setup-git
            git push --force-with-lease="refs/heads/$branch:$old" origin "HEAD:refs/heads/$branch"
          fi
          # Backticks are literal Markdown code delimiters.
          # shellcheck disable=SC2016
          body=$(printf 'Automated merge of KDE Connect tag `%s` (commit `%s`) into main `%s`.\n\nTests and APK builds: **%s**. [Workflow run](%s)\n\nThe automated checks do not exercise a real Shizuku service.' "$UPSTREAM_TAG" "$UPSTREAM_SHA" "$BASE_SHA" "$TEST_RESULT" "$RUN_URL")
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "Sync KDE Connect upstream $UPSTREAM_TAG" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "Sync KDE Connect upstream $UPSTREAM_TAG" --body "$body"
          fi

          if [ "$TEST_RESULT" != success ]; then
            echo '::error::Tests failed; automatic merge is blocked.'
            exit 1
          fi
          # Push the exact tested merge as a fast-forward, with an atomic base lease.
          # This prevents a change to main between verification and publication.
          head=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          test "$(git rev-parse refs/remotes/origin/$branch)" = "$head"
          read -r commit parent1 parent2 extra < <(git rev-list --parents -n 1 "$head")
          test "$parent1" = "$BASE_SHA" && test "$parent2" = "$UPSTREAM_SHA" && test -z "${extra:-}"
          test "$(git rev-parse "$head^{tree}")" = "$EXPECTED_TREE"
          current_tag=$(git ls-remote --refs https://github.com/KDE/kdeconnect-android.git "refs/tags/$UPSTREAM_TAG" | cut -f1)
          test "$current_tag" = "$UPSTREAM_TAG_OBJECT" || { echo '::error::Upstream tag changed before merge.'; exit 1; }
          gh auth setup-git
          git push --force-with-lease="refs/heads/main:$BASE_SHA" origin "$head:refs/heads/main"
          echo "merged_commit=$head" >> "$GITHUB_OUTPUT"
          git push --force-with-lease="refs/heads/$branch:$head" origin ":refs/heads/$branch"

  release:
    needs: [prepare, pull-request]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.pull-request.result == 'success' || needs.prepare.outputs.already_included == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      commit: ${{ needs.pull-request.outputs.merged_commit || needs.prepare.outputs.base }}
      upstream_tag: ${{ needs.prepare.outputs.upstream_tag }}
    secrets: inherit
